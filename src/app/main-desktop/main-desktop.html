<div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: url('https://primefaces.org/cdn/primeng/images/dock/window.jpg') no-repeat center center / cover; overflow: visible; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 0 20px 20px 20px; box-sizing: border-box;">
    <div style="text-align: center; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
        <h1 style="font-size: 3rem; margin-bottom: 0.5rem;">Welcome to My Desktop</h1>
        <p style="font-size: 1.5rem;">Explore my profile using the dock below.</p>
    </div>

    <p-dock [model]="dockItems" position="bottom">
        <ng-template pTemplate="item" let-item>
            <div class="dock-item-wrapper">
                <img [src]="item.icon" [alt]="item.label" width="100%" style="width: 100%; height: 100%; display: block;" pTooltip="{{item.label}}" tooltipPosition="top" />
            </div>
        </ng-template>
    </p-dock>

    @for (dialog of dialogs; track dialog.id) {
        <p-dialog
            [(visible)]="dialog.visible"
            [modal]="false"
            [draggable]="true"
            [resizable]="true"
            [maximizable]="true"
            [header]="dialog.title"
            [style]="{'width': '50vw'}"
            (onHide)="removeDialog(dialog.id)">
            <p class="m-0">{{ dialog.content }}</p>
        </p-dialog>
    }
</div>
